version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - cd frontend
        - echo "VITE_API_URL=$VITE_API_URL" > .env.production
        - npm run build
  artifacts:
    baseDirectory: frontend/dist/spa
    files:
      - "**/*"
  cache:
    paths:
      - frontend/.npm/**/*
      - frontend/node_modules/**/*
