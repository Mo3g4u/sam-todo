name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv venv && . .venv/bin/activate && uv pip install -r requirements-dev.txt

      - name: Lint
        run: .venv/bin/ruff check src/ tests/

      - name: Format check
        run: .venv/bin/ruff format --check src/ tests/

      - name: Test
        run: .venv/bin/python -m pytest tests/ -v
        env:
          AWS_DEFAULT_REGION: ap-northeast-1

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v2

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: SAM build
        run: sam build --template-file template-deploy.yaml

      - name: Delete failed stack if exists
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name sam-todo --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NOT_FOUND")
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Deleting ROLLBACK_COMPLETE stack..."
            aws cloudformation delete-stack --stack-name sam-todo
            aws cloudformation wait stack-delete-complete --stack-name sam-todo
          fi

      - name: SAM deploy
        run: |
          PARAMS=""
          if [ -n "${{ secrets.FRONTEND_URL }}" ]; then
            PARAMS="--parameter-overrides FrontendUrl=${{ secrets.FRONTEND_URL }}"
          fi
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name sam-todo \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            $PARAMS
