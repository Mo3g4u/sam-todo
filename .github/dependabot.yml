version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "vitest"
        versions: [">=4.0.0"]
      - dependency-name: "eslint"
        versions: [">=9.0.0"]
      - dependency-name: "eslint-plugin-vue"
        versions: [">=10.0.0"]
      - dependency-name: "vue-router"
        versions: [">=5.0.0"]
    groups:
      dev-dependencies:
        dependency-type: "development"

  # pip dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

  # GitHub Actions SHA pinning updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
